<main class="auth-page">
  <section class="auth-card" aria-label="Login form">
    <header class="auth-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your account.</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="submitForm()" class="auth-form">
      <div class="form-field">
        <p-floatlabel variant="on">
          <input pInputText id="email" formControlName="email" style="width: 100%" />
          <label for="email">Email</label>
        </p-floatlabel>
        <p class="field-error">
          <small
            *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            class="error-text"
          >
            Email is required.
          </small>
        </p>
      </div>

      <div class="form-field">
        <p-inputgroup>
          <p-floatlabel variant="on">
            <input
              [type]="showPassword ? 'text' : 'password'"
              pInputText
              id="password"
              formControlName="password"
              style="width: 100%"
            />
            <label for="password">Password</label>
          </p-floatlabel>
          <p-inputgroup-addon>
            <p-button
              [icon]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"
              severity="secondary"
              variant="text"
              [ariaLabel]="showPassword ? 'Hide password' : 'Show password'"
              (click)="showPassword = !showPassword"
            />
          </p-inputgroup-addon>
        </p-inputgroup>
        <p class="field-error">
          <small
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            class="error-text"
          >
            Password is required.
          </small>
        </p>
      </div>

      <p class="switch-auth">
        Don't have an account?
        <span>
          <a [routerLink]="['/register']">Signup</a>
        </span>
      </p>

      <p-button
        [label]="isLoading() ? 'Signing in...' : 'Signin'"
        size="large"
        type="submit"
        styleClass="w-full"
        [loading]="isLoading()"
        [disabled]="loginForm.invalid || isLoading() || isGoogleLoading()"
      />

      <!-- <div class="divider" aria-hidden="true"></div>

      <p-button
        [label]="isGoogleLoading() ? 'Redirecting...' : 'Continue with Google'"
        icon="pi pi-google"
        severity="secondary"
        variant="outlined"
        size="large"
        type="button"
        styleClass="w-full"
        [loading]="isGoogleLoading()"
        [disabled]="isLoading() || isGoogleLoading()"
        (onClick)="loginWithGoogle()"
      /> -->
    </form>
  </section>
</main>
