<div class="problem-filter-container">
  <div class="search-section">
    <input
      pInputText
      type="text"
      placeholder="Search problems..."
      [value]="searchTerm()"
      (input)="handleSearchInput($event)"
      class="search-input"
    />
  </div>

  <div class="problems-list">
    @if (filteredProblems().length === 0) {
      <div class="empty-state">No problems found</div>
    } @else {
      @for (problem of filteredProblems(); track problem.id) {
        <div class="problem-item" (click)="toggleSelection(problem.id)">
          <input
            type="checkbox"
            [checked]="isSelected(problem.id)"
            (change)="toggleSelection(problem.id)"
            class="problem-checkbox"
          />
          <div class="problem-info">
            <div class="problem-title">{{ problem.title }}</div>
            <div class="problem-meta">
              <span class="difficulty" [class]="'difficulty-' + problem.difficulty">
                {{ problem.difficulty }}
              </span>
            </div>
          </div>
        </div>
      }
    }
  </div>

  <div class="actions">
    <button pButton type="button" label="Confirm" (click)="confirm()" severity="success"></button>
  </div>
</div>
