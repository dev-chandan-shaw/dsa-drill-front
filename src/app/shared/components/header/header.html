<header>
  <button class="hamburger-btn" (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
    <i class="pi pi-bars hamburger-icon"></i>
  </button>

  <div 
    class="logo cursor-pointer" 
    (click)="navigateToHome()" 
    (keydown.enter)="navigateToHome()"
    role="button" 
    tabindex="0" 
    aria-label="DSA Drill homepage"
  >
    <h1>DSA Drill</h1>
  </div>

  <div class="flex-1"></div>

  <div class="user-profile">
    @if (isLoggedIn()) {
      <button 
        type="button" 
        class="profile-trigger" 
        (click)="profileMenu.toggle($event)"
        aria-haspopup="true"
        aria-label="Open user profile menu"
      >
        @if (loggedInUser()?.profilePictureUrl) {
          <img
            class="avatar-image"
            [src]="loggedInUser()?.profilePictureUrl"
            [alt]="userFullName()"
          />
        } @else {
          <span class="avatar" role="img" [attr.aria-label]="'User initial ' + userInitial">
            {{ userInitial }}
          </span>
        }
      </button>
    } @else if (isAuthResolved() && !isAuthLoading()) {
      <button type="button" class="login-button" (click)="navigateToLogin()">Login</button>
    }
  </div>
  @if (isLoggedIn()) {
    <p-menu #profileMenu appendTo="body" [popup]="true" [model]="menuitems()" styleClass="profile-menu"></p-menu>
  }
</header>

<ng-template #sidebarTemplate>
  <app-sidebar></app-sidebar>
</ng-template>
