<div class="tag-based-list-container">
  <div class="flex justify-between mb-2">
    <div class="flex justify-between items-center gap-4">
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          type="text"
          size="small"
          pInputText
          pSize="small"
          rounded
          class="!rounded-full"
          placeholder="Search"
          [value]="searchTerm()"
          (input)="handleSearchInput($event)"
        />
      </p-iconfield>
    </div>
  </div>

  <div class="problems-section">
    @if (filteredProblems().length === 0) {
      <div class="empty-state">
        <i class="pi pi-search empty-icon" aria-hidden="true"></i>
        <div class="empty-title">No problems found</div>
        <div class="empty-subtitle">Try a different keyword or clear the search.</div>
      </div>
    } @else {
      @for (problem of filteredProblems(); let rowIndex = $index; track problem.id) {
        <div
          [ngClass]="{ 'bg-[var(--p-surface-800)] rounded-lg': rowIndex % 2 === 0 }"
          class="group min-w-0 p-3 flex items-center gap-4 text-sm"
        >
          <input
            type="checkbox"
            class="problem-checkbox cursor-pointer"
            [checked]="isSelected(problem.id)"
            (change)="toggleProblemSelection(problem.id)"
          />
          <button
            type="button"
            class="flex-1 min-w-0 cursor-pointer whitespace-normal break-words text-left"
            (click)="toggleProblemSelection(problem.id)"
          >
            {{ problem.title }}
          </button>
        </div>
      }
    }
  </div>
</div>
