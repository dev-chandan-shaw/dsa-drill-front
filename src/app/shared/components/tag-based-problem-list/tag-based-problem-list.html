<div class="tag-based-list-container">
  <div class="list-toolbar">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
      <mat-icon matPrefix aria-hidden="true">search</mat-icon>
      <mat-label>Search problems to select</mat-label>
      <input
        matInput
        type="text"
        [value]="searchTerm()"
        (input)="setSearchTerm($any($event.target).value)"
      />
    </mat-form-field>
  </div>

  <div class="problems-section">
    @if (filteredProblems().length === 0) {
      <div class="empty-state">
        <mat-icon class="empty-icon" aria-hidden="true">search</mat-icon>
        <div class="empty-title">No problems found</div>
        <div class="empty-subtitle">Try a different keyword or clear the search.</div>
      </div>
    } @else {
      @for (problem of filteredProblems(); let rowIndex = $index; track problem.id) {
        <div class="problem-row" [class.zebra]="rowIndex % 2 === 0">
          <mat-checkbox
            [checked]="isSelected(problem.id)"
            (change)="toggleProblemSelection(problem.id)"
            [aria-label]="'Select problem: ' + problem.title"
          >
            <span class="problem-title">{{ problem.title }}</span>
          </mat-checkbox>
        </div>
      }
    }
  </div>
</div>
