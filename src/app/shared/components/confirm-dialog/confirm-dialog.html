<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="decline()">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>
  <button
    mat-flat-button
    type="button"
    [color]="data.dangerous === false ? undefined : 'warn'"
    (click)="accept()"
    cdkFocusInitial
  >
    {{ data.confirmLabel ?? 'Delete' }}
  </button>
</mat-dialog-actions>
