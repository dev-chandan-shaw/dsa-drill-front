<nav class="sidebar" aria-label="Library">
  @if (showHeader()) {
    <div class="sidebar-header">
      <button
        mat-icon-button
        (click)="closeSidebar()"
        aria-label="Close sidebar menu"
      >
        <mat-icon>close</mat-icon>
      </button>

      <div class="logo">
        <h1>DSA Drill</h1>
      </div>
    </div>
  }

  <div class="sidebar-nav">
    @for (subject of subjects; track subject.code) {
      <a
        class="nav-item"
        [routerLink]="['/library', subject.code]"
        routerLinkActive="active"
        (click)="navigate()"
      >
        <mat-icon class="nav-icon" aria-hidden="true">
          {{ subject.icon }}
        </mat-icon>

        <span class="nav-label">{{ subject.title }}</span>
      </a>
    }

    @if (isAdmin()) {
      <a
        class="nav-item"
        routerLink="/admin"
        routerLinkActive="active"
        (click)="navigate()"
      >
        <mat-icon class="nav-icon" aria-hidden="true">
          settings
        </mat-icon>

        <span class="nav-label">Admin</span>
      </a>
      <div class="nav-children" role="group" aria-label="Admin sections">
        @for (section of adminSections; track section.path) {
          <a
            class="nav-item"
            [routerLink]="section.path"
            routerLinkActive="active"
            #active="routerLinkActive"
            [attr.aria-current]="active.isActive ? 'page' : null"
            (click)="navigate()"
          >
            <mat-icon class="nav-icon" aria-hidden="true">{{ section.icon }}</mat-icon>
            <span class="nav-label">{{ section.title }}</span>
          </a>
        }
      </div>
    }
  </div>
</nav>
