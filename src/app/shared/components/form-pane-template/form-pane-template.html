<div class="flex flex-col h-full">
  <div class="pane-header">
    <h2 class="pane-title">{{ title }}</h2>
    <button
      mat-icon-button
      type="button"
      (click)="cancelForm.emit()"
      [attr.aria-label]="'Close ' + title"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-divider></mat-divider>
  <div class="flex-1 overflow-y-auto pane-body">
    <ng-content></ng-content>
  </div>
  <mat-divider></mat-divider>
  <div class="pane-footer">
    @if (autoSaveMode) {
      <app-save-state-indicator
        class="save-state"
        [state]="saveState"
        [savedAt]="savedAt"
        (retry)="retrySave.emit()"
      ></app-save-state-indicator>
    } @else if (isEditMode) {
      <button
        mat-flat-button
        type="button"
        [disabled]="!form.valid || isSaving"
        (click)="saveForm.emit()"
      >
        {{ isSaving ? 'Saving…' : 'Save changes' }}
      </button>
    } @else {
      <button mat-flat-button type="button" [disabled]="!form.valid || isSaving" (click)="addForm.emit()">
        {{ isSaving ? 'Adding…' : 'Add' }}
      </button>
    }
    <button mat-button type="button" (click)="cancelForm.emit()">
      {{ autoSaveMode ? 'Close' : 'Cancel' }}
    </button>
  </div>
</div>
