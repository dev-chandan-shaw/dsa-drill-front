@if (!hasLoaded() && !loadError()) {
  <div class="page-shell" role="status" aria-label="Loading problems list">
    <div class="skeleton-list" aria-hidden="true">
      @for (_ of skeletonRows; track $index) {
        <div class="skeleton-row"></div>
      }
    </div>
  </div>
} @else if (loadError()) {
  <div class="load-error" role="alert">
    <mat-icon aria-hidden="true">cloud_off</mat-icon>
    <div class="load-error-title">Couldn't load this sheet</div>
    <div class="load-error-subtitle">Check your connection and try again.</div>
    <button mat-flat-button type="button" (click)="retry()">Retry</button>
  </div>
} @else {
  <div class="sheet-layout">
    <aside class="sheet-summary" aria-label="Sheet progress summary">
      <app-sheet-summary-card
        [title]="sheetTagName()"
        [total]="totalCount()"
        [easyTotal]="easyCount()"
        [mediumTotal]="mediumCount()"
        [hardTotal]="hardCount()"
        [solvedTotal]="solvedCount()"
        [solvedEasy]="solvedEasyCount()"
        [solvedMedium]="solvedMediumCount()"
        [solvedHard]="solvedHardCount()"
        [solvedPercent]="solvedPercent()"
      ></app-sheet-summary-card>
    </aside>

    <div class="sheet-content">
      <app-problem-list [problems]="problems()"></app-problem-list>
    </div>
  </div>
}
