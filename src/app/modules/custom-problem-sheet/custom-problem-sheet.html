@if (!hasLoaded()) {
  <div class="page-shell" role="status" aria-label="Loading custom problems list">
    <div class="skeleton-list" aria-hidden="true">
      @for (_ of skeletonRows; track $index) {
        <div class="skeleton-row"></div>
      }
    </div>
  </div>
} @else {
  <div class="sheet-layout">
    <aside class="sheet-summary" aria-label="Sheet progress summary">
      <app-sheet-summary-card
        [title]="sheetName() || 'Custom Sheet'"
        [total]="totalCount()"
        [easyTotal]="easyCount()"
        [mediumTotal]="mediumCount()"
        [hardTotal]="hardCount()"
        [solvedTotal]="solvedCount()"
        [solvedEasy]="solvedEasyCount()"
        [solvedMedium]="solvedMediumCount()"
        [solvedHard]="solvedHardCount()"
        [solvedPercent]="solvedPercent()"
      >
        @if (isOwner()) {
          <button
            card-action
            mat-icon-button
            type="button"
            (click)="openProblemSelector()"
            matTooltip="Add problems to this sheet"
            aria-label="Add problems to this sheet"
          >
            <mat-icon>add</mat-icon>
          </button>
        } @else {
          <button
            card-action
            mat-icon-button
            type="button"
            (click)="toggleSavedSheet()"
            [matTooltip]="isProblemSheetSaved() ? 'Unsave problem sheet' : 'Save problem sheet'"
            [attr.aria-label]="isProblemSheetSaved() ? 'Unsave problem sheet' : 'Save problem sheet'"
            [attr.aria-pressed]="isProblemSheetSaved()"
          >
            <mat-icon>{{ isProblemSheetSaved() ? 'bookmark' : 'bookmark_border' }}</mat-icon>
          </button>
        }
      </app-sheet-summary-card>
    </aside>

    <div class="sheet-content">
      <app-problem-list [problems]="problems()"></app-problem-list>
    </div>
  </div>
}

<ng-template #problemSelectorTemplate>
  <app-form-pane-template
    [form]="selectionForm"
    [isSaving]="isSelectionSaving()"
    [isEditMode]="false"
    [title]="'Add Questions'"
    (addForm)="applyProblemSelection()"
    (cancelForm)="closeProblemSelector()"
  >
    <app-tag-based-problem-list [selectedControl]="selectionForm.controls.problemIds" />
  </app-form-pane-template>
</ng-template>
