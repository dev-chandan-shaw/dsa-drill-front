@if (loadError()) {
  <p role="alert">This sheet is unavailable or is no longer shared with you.</p>
} @else if (!hasLoaded()) {
  <div class="sheet-layout" role="status" aria-label="Loading custom problems list">
    <aside class="sheet-summary" aria-hidden="true">
      <div class="skel skel-block" style="--h: 300px"></div>
    </aside>
    <div class="sheet-content" aria-hidden="true">
      <div class="skeleton-list">
        @for (_ of skeletonRows; track $index) {
          <div class="skeleton-row"></div>
        }
      </div>
    </div>
  </div>
} @else {
  <div class="sheet-layout">
    <aside class="sheet-summary" aria-label="Sheet progress summary">
      <app-sheet-summary-card
        [title]="sheetName() || 'Custom Sheet'"
        [total]="totalCount()"
        [easyTotal]="easyCount()"
        [mediumTotal]="mediumCount()"
        [hardTotal]="hardCount()"
        [solvedTotal]="solvedCount()"
        [solvedEasy]="solvedEasyCount()"
        [solvedMedium]="solvedMediumCount()"
        [solvedHard]="solvedHardCount()"
        [solvedPercent]="solvedPercent()"
      >
        @if (isOwner()) {
          <button
            card-action
            mat-icon-button
            type="button"
            (click)="openProblemSelector()"
            matTooltip="Add problems to this sheet"
            aria-label="Add problems to this sheet"
          >
            <mat-icon>add</mat-icon>
          </button>
        }
      </app-sheet-summary-card>
      @if(problemSheet();as sheet){
        <app-item-actions type="SHEET" [id]="sheet.id" [title]="sheet.title"/>
        @if (isOwner()) {
          <button mat-button type="button" [disabled]="changingVisibility()" (click)="toggleVisibility()">
            {{ sharedByLink() ? 'Make private' : 'Share by link' }}
          </button>
        }
      }
    </aside>

    <div class="sheet-content">
      <app-problem-list [problems]="problems()" [preserveOrder]="true"></app-problem-list>
    </div>
  </div>
}

<ng-template #problemSelectorTemplate>
  <app-form-pane-template
    [form]="selectionForm"
    [isSaving]="isSelectionSaving()"
    [isEditMode]="false"
    [title]="'Add Questions'"
    (addForm)="applyProblemSelection()"
    (cancelForm)="closeProblemSelector()"
  >
    <app-tag-based-problem-list [selectedControl]="selectionForm.controls.problemIds" />
  </app-form-pane-template>
</ng-template>
