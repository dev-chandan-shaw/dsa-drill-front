@if (hasLoaded()) {
  <div class="flex home flex-col p-4 h-full overflow-y-auto">
    <!-- Normal List -->
    <div class="flex flex-wrap gap-2 items-center">
      @for (category of tags(); track $index) {
        <p
          [routerLink]="['/problems', category.slug]"
          class="cursor-pointer px-2 py-1 rounded-full text-sm flex gap-1 flex-wrap items-center"
        >
          <span>{{ category.name }}</span>
          <span class="bg-[var(--p-surface-800)] text-[var(--p-surface-400)] px-2 rounded-full">{{
            category.problemCount ?? 0
          }}</span>
        </p>
      }
    </div>
    <p-divider styleClass="m-0"></p-divider>
    <app-problem-list [problems]="problems()"></app-problem-list>
  </div>
} @else {
  <p-progressbar mode="indeterminate" [style]="{ height: '4px' }" />
}
