@if (isLoading()) {
  <p-progressbar mode="indeterminate" [style]="{ height: '4px' }"></p-progressbar>
} @else if (question()) {
  <section class="problem-workspace-shell">
    <p-splitter [panelSizes]="horizontalPanelSizes" styleClass="workspace-splitter">
      <ng-template #panel>
        <div class="panel-content">
          <app-problem-description [question]="question()!"></app-problem-description>
        </div>
      </ng-template>
      <ng-template #panel>
        <p-splitter
          [layout]="'vertical'"
          [panelSizes]="verticalPanelSizes"
          styleClass="workspace-splitter"
        >
          <ng-template #panel>
            <div class="panel-content editor-panel">
              <app-editor-component
                [isSubmitting]="isSubmitting()"
                (submitCode)="onSubmitCode($event)"
                [question]="question()!"
              ></app-editor-component>
            </div>
          </ng-template>
          <ng-template #panel>
            <div class="panel-content">
              <app-test-case
                [submissionResult]="submissionResult()"
                [testCases]="testCases()"
              ></app-test-case>
            </div>
          </ng-template>
        </p-splitter>
      </ng-template>
    </p-splitter>
  </section>
}
