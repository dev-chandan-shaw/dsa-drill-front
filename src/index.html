<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>DSA Drill</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="DSA Drill — practice handpicked DSA coding questions by topic and pattern, track solved status, and prepare for coding interviews."
    />
    <link rel="canonical" href="https://dsa-drill.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSA Drill" />
    <meta property="og:title" content="DSA Drill" />
    <meta
      property="og:description"
      content="Practice handpicked DSA coding questions by topic and pattern, track solved status, and prepare for coding interviews."
    />
    <meta property="og:url" content="https://dsa-drill.vercel.app/" />
    <meta property="og:image" content="https://dsa-drill.vercel.app/dsadrilllogo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DSA Drill" />
    <meta
      name="twitter:description"
      content="Practice handpicked DSA coding questions by topic and pattern, track solved status, and prepare for coding interviews."
    />
    <meta name="twitter:image" content="https://dsa-drill.vercel.app/dsadrilllogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS: render-blocking third-party CSS delays first
      paint (white flash). Load async, fall back to system fonts meanwhile. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="icon" type="image/png" href="dsadrilllogo.png" />
    <meta name="google-site-verification" content="9j56z9pK3K_I9nl1N3mYP-xDFcYREfo1PdEX3_nIjL0" />
    <style>
      /* Critical boot shell: paints before app CSS/JS so reloads never flash
        white. Colors match the M3 theme surfaces (dark #0e1110 / light #f9fafa)
        and brand emerald; kept in sync with dsa-theme.scss by hand. */
      html {
        background: #0e1110;
      }
      html:not(.dark) {
        background: #f9fafa;
      }
      body {
        margin: 0;
      }
      .boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: 'Sora', Inter, system-ui, sans-serif;
      }
      .boot-logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #34d399;
      }
      html:not(.dark) .boot-logo {
        color: #24a878;
      }
      .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.18);
        overflow: hidden;
      }
      .boot-bar > span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: #34d399;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar > span {
          animation: none;
        }
      }
    </style>
    <script>
      // Pre-paint theme: same rule as ThemeService (stored pref > OS > dark).
      // Runs before first paint to avoid any flash.
      (function () {
        try {
          var stored = localStorage.getItem('dsa-drill-theme');
          var dark =
            stored === 'dark'
              ? true
              : stored === 'light'
                ? false
                : !window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* keep server-rendered default */
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <!-- Boot splash: replaced automatically when Angular bootstraps. -->
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-logo">DSA Drill</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </app-root>
  </body>
</html>
